
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shopify Product Page</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background-color: #111; color: #fff; }
    .container { max-width: 1200px; margin: auto; padding: 20px; }
    h1, h2 { text-align: center; }
    .breadcrumb { color: #ccc; margin-bottom: 20px; }
    .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
    .product { background-color: #fff; color: #000; padding: 20px; border-radius: 8px; text-align: center; }
    .product img { width: 100%; height: 180px; object-fit: contain; margin-bottom: 10px; }
    .product button, .checkout-btn, .place-order-btn {
      background-color: #444; color: white; border: none; padding: 10px 15px;
      margin-top: 10px; cursor: pointer; border-radius: 5px;
    }
    .cart, .checkout-form { margin-top: 40px; background-color: #222; padding: 20px; border-radius: 8px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 10px; border-radius: 5px; border: none; outline: none;
    }
    @media screen and (max-width: 600px) {
      .products { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="breadcrumb">Home / All Products</div>
    <h1>Our Products</h1>
    <div class="products" id="product-list"></div>

    <div class="cart">
      <h2>Your Cart</h2>
      <div id="cart-items">No items in cart.</div>
      <h3 id="cart-total"></h3>
      <button class="checkout-btn" onclick="showCheckoutForm()">Checkout</button>
    </div>

    <div class="checkout-form" id="checkout-form" style="display:none;">
      <h2>Checkout Form</h2>
      <form method="POST" action="checkout.php" onsubmit="return submitForm(this)">
        <div class="form-group">
          <label for="name">Name:</label>
          <input type="text" name="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="address">Address:</label>
          <textarea name="address" required></textarea>
        </div>
        <div class="form-group">
          <label for="mobile">Mobile:</label>
          <input type="text" name="mobile" required>
        </div>
        <input type="hidden" name="products" id="productsData">
        <input type="hidden" name="total" id="totalAmount">
        <button class="place-order-btn" type="submit">Place Order</button>
      </form>
    </div>
  </div>

  <script>
    const products = [
      { id: 1, name: 'Laptop', price: 29999, image: 'images/ales-nesetril-Im7lZjxeLhg-unsplash.jpg', description: 'Comfortable laptop.' },
      { id: 2, name: 'Backpack', price: 4999, image: 'images/pexels-sebastian-214574.jpg', description: 'Stylish leather backpack.' },
      { id: 3, name: 'Phone', price: 15000, image: 'images/neil-soni-6wdRuK7bVTE-unsplash.jpg', description: 'Good quality phone.' },
      { id: 4, name: 'Art Frame', price: 3999, image: 'images/ef6ab023-eb9c-47d8-af2d-90b50994b8fb.jpg', description: 'Minimalist wall art.' }
    ];
    const cart = {};

    function renderProducts() {
      const list = document.getElementById('product-list');
      list.innerHTML = '';
      products.forEach(p => {
        const div = document.createElement('div');
        div.className = 'product';
        div.innerHTML = `
          <img src="${p.image}" alt="${p.name}">
          <h3>${p.name}</h3>
          <p>${p.description}</p>
          <strong>₹${p.price}</strong><br/>
          <button onclick="addToCart(${p.id})">Add to Cart</button>
        `;
        list.appendChild(div);
      });
    }

    function addToCart(id) {
      cart[id] = (cart[id] || 0) + 1;
      updateCart();
    }

    function updateCart() {
      const items = document.getElementById('cart-items');
      items.innerHTML = '';
      let total = 0;
      for (let id in cart) {
        const p = products.find(prod => prod.id == id);
        const qty = cart[id];
        const subtotal = p.price * qty;
        const line = document.createElement('div');
        line.textContent = `${qty} x ${p.name} = ₹${subtotal}`;
        items.appendChild(line);
        total += subtotal;
      }
      document.getElementById('cart-total').innerText = total > 0 ? `Total: ₹${total}` : '';
      document.getElementById('totalAmount').value = total;
    }

    function showCheckoutForm() {
      if (Object.keys(cart).length === 0) {
        alert("Your cart is empty!");
        return;
      }
      const summary = [];
      for (let id in cart) {
        const p = products.find(prod => prod.id == id);
        summary.push(`${cart[id]} x ${p.name}`);
      }
      document.getElementById('productsData').value = summary.join(", ");
      document.getElementById('checkout-form').style.display = 'block';
      window.scrollTo(0, document.body.scrollHeight);
    }

    function submitForm(form) {
      if (!form.checkValidity()) return false;
      alert("Your order is complete. Please wait, your order will be delivered on time.");
      return true;
    }

    renderProducts();
  </script>
</body>
</html>
